name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: sitemap <lastmod> and the pages' "Last updated"
          # dates come from each source file's last commit (src/seo/lastmod.mjs).
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build with Astro
        run: npm run build
        # TEMPORARY, by decision on 2026-09-08: publish with the empty keys in
        # src/config/business.ts omitted (no phone buttons, no prices, Spanish
        # gated). Remove this env block once the keys are filled so the guard
        # protects production again.
        env:
          KERES_ALLOW_MISSING: "1"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing (and Yandex, Seznam, Naver via the shared IndexNow API) about
  # every sitemap URL after each deploy. Bing's index feeds ChatGPT search and
  # Copilot. The key file public/dfe97f3cfcb4c4e5f6a25992f0f7f6b5.txt proves ownership.
  # A failed ping never fails the deploy.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Submit sitemap URLs to IndexNow
        run: |
          sleep 30
          urls=$(curl -fsSL https://www.keresai.com/sitemap-0.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s .)
          jq -n --argjson urls "$urls" '{host:"www.keresai.com", key:"dfe97f3cfcb4c4e5f6a25992f0f7f6b5", keyLocation:"https://www.keresai.com/dfe97f3cfcb4c4e5f6a25992f0f7f6b5.txt", urlList:$urls}' > body.json
          curl -sS -o /dev/null -w 'IndexNow HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data @body.json
